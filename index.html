<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three.js game prototype</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #stats { position: fixed; left: 12px; top: 10px; padding: 4px 10px; border-radius: 8px; background: rgba(10, 12, 16, 0.6); color: #cfe9c9; font: 13px ui-monospace, monospace; }
      #note { position: fixed; left: 12px; bottom: 12px; padding: 6px 12px; border-radius: 8px; background: rgba(10, 12, 16, 0.6); color: #e8ecf1; font: 13px ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="stats">loading…</div>
    <div id="note">Click to capture the mouse · WASD move · Shift run · Space jump · E use · V view · wheel zoom · Esc menu · R rain · B bang · F fly · N walkable area</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
